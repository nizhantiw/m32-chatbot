version: '3.9'

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - '3001:3001'
    env_file:
      - .env
    volumes:
      - db_data:/app/data
    environment:
      DB_PATH: /app/data/bizpilot.db
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/health']
      interval: 30s
      timeout: 10s
      retries: 3

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    ports:
      - '80:80'
    depends_on:
      - server
    restart: unless-stopped

volumes:
  db_data:
